<?xml version="1.0" encoding="UTF-8"?>
<svg width="3840" height="2160" viewBox="0 0 3840 2160" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="mainColorGradient" x1="50%" y1="0%" x2="50%" y2="100%">
            <!-- Gradient emphasizing #4F92C7 -->
            <stop offset="0%" style="stop-color:#7FB2DC;stop-opacity:1" />
            <stop offset="30%" style="stop-color:#4F92C7;stop-opacity:1" />
            <stop offset="70%" style="stop-color:#4F92C7;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#3A7BB3;stop-opacity:1" />
        </linearGradient>
        
        <radialGradient id="centerHighlight" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <!-- Radial highlight to emphasize center -->
            <stop offset="0%" style="stop-color:#4F92C7;stop-opacity:0.9" />
            <stop offset="100%" style="stop-color:#4F92C7;stop-opacity:0.7" />
        </radialGradient>
    </defs>
    
    <!-- Main gradient background emphasizing #4F92C7 -->
    <rect width="3840" height="2160" fill="url(#mainColorGradient)"/>
    
    <!-- Center radial emphasis -->
    <circle cx="1920" cy="1080" r="800" fill="url(#centerHighlight)" opacity="0.3"/>
</svg>